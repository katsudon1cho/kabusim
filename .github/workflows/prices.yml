name: prices

# 市場が開いている間だけ15分ごとに価格を取り直してサイトを配信し直す。
# Claude は起動しないので、利用枠は一切消費しない。
#
# cron は UTC。JST = UTC+9。
#   */15 0-6   → JST 09:00〜15:45  日本市場（9:00〜15:30）
#   */15 13-20 → JST 22:00〜05:45  米国市場（夏 22:30〜05:00）
#
# 米国は冬時間で1時間後ろにずれる。11月に "*/15 14-21" へ差し替えること。
#
# 注意: GitHub のスケジュール実行は混雑時に5〜20分遅れる。
# yfinance 自体の数分遅れと合わせて、実際の粒度は15〜30分になる。

on:
  schedule:
    - cron: "*/15 0-6 * * 1-5"
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:

# 再利用ワークフローは呼び出し側の権限しか引き継げない。
# ここで宣言しないと deploy-pages.yml が pages:write を要求できず起動に失敗する。
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    uses: ./.github/workflows/deploy-pages.yml
