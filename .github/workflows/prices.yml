name: prices

# 市場が開いている間だけ15分ごとに価格を取り直してサイトを配信し直す。
# Claude は起動しないので、利用枠は一切消費しない。
#
# 発火は cron-job.org からの repository_dispatch だけ。20分おきに飛んでくる。
#
# 以前はここにも schedule を置いていたが、外部の tick と二重に発火して
# 配信の負荷が倍になっていた。8/7 に配信の列が詰まったとき、この重複が
# 待機列を伸ばして cancel の連鎖を悪化させたため削除した。
# 外部が止まったときの保険は session.yml 側の schedule が担う。

on:
  repository_dispatch:
    types: [prices]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    uses: ./.github/workflows/deploy-site.yml
    # 再利用ワークフローには権限もシークレットも自動では引き継がれない。
    # これが無いと VERCEL_TOKEN が空になり「--token に値がない」で落ちる。
    secrets: inherit
