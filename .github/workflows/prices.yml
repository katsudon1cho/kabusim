name: prices

# 市場が開いている間だけ15分ごとに価格を取り直してサイトを配信し直す。
# Claude は起動しないので、利用枠は一切消費しない。
#
# cron は UTC。JST = UTC+9。
#   7,27,47 0-6   → JST 09:07〜15:47  日本市場（9:00〜15:30）
#   7,27,47 13-20 → JST 22:07〜05:47  米国市場（夏 22:30〜05:00）
#
# 米国は冬時間で1時間後ろにずれる。11月に "7,27,47 14-21" へ差し替えること。
#
# 注意: GitHub のスケジュールはベストエフォートで、高頻度な指定ほど
# 間引かれる。当初 */15 にしていたが実測では1〜2時間おきにしか走らなかった。
# 20分間隔・丁度でない分に変えて改善を狙うが、それでも保証はされない。
# 時刻の正確さが要るなら repository_dispatch を外部から叩くこと。

on:
  schedule:
    - cron: "7,27,47 0-6 * * 1-5"
    - cron: "7,27,47 13-20 * * 1-5"
  repository_dispatch:
    types: [prices]
  workflow_dispatch:

# 再利用ワークフローは呼び出し側の権限しか引き継げない。
# ここで宣言しないと deploy-pages.yml が pages:write を要求できず起動に失敗する。
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    uses: ./.github/workflows/deploy-pages.yml
