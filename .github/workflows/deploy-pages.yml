name: deploy pages

# サイトはブランチではなくビルド成果物から配信する。
# 価格更新は15分ごとに走るため、コミットして配信する方式だと git の履歴が
# 価格データで埋まり、肝心の「いつ何を判断したか」を追えなくなる。
# docs/data/ は毎回ここで作り直すので、リポジトリには残さない（.gitignore）。

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages のデプロイは同時に1つまで。あとから来たものを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      # 既定ではワークフローを起動したコミットを取りに行くため、
      # セッションジョブが直前に push した台帳や日報が入らない。
      # 必ずブランチの先端を取る。
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --quiet -r requirements.txt

      - name: 台帳から画面用データを作る
        run: python build_site.py

      - name: 現在値と値動きを取り直す
        run: python update_prices.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: dep
        uses: actions/deploy-pages@v4
