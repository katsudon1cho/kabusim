name: deploy pages

# サイトはブランチではなくビルド成果物から配信する。
# 価格更新は15分ごとに走るため、コミットして配信する方式だと git の履歴が
# 価格データで埋まり、肝心の「いつ何を判断したか」を追えなくなる。
# docs/data/ は毎回ここで作り直すので、リポジトリには残さない（.gitignore）。

on:
  workflow_call:
    inputs:
      # 配信の失敗を、呼び出し元の実行の失敗として扱うか。
      # prices は配信そのものが目的なので既定の true。セッションは売買の判断が
      # 目的で、配信は付随作業にすぎない。Pages が詰まっただけで実行が赤くなると
      # 「セッションが失敗した」と読めてしまい、成否の表示が信用できなくなる。
      fail_on_error:
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Pages のデプロイは同時に1つまで。あとから来たものを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      # 既定ではワークフローを起動したコミットを取りに行くため、
      # セッションジョブが直前に push した台帳や日報が入らない。
      # 必ずブランチの先端を取る。
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --quiet -r requirements.txt

      - name: 台帳から画面用データを作る
        run: python build_site.py

      - name: 現在値と値動きを取り直す
        run: python update_prices.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # 既定のタイムアウトは600秒。Pages 側が詰まると1回の失敗に10分かかり、
      # concurrency: pages で直列化しているぶん後続の配信も待たされる。
      # 正常時の所要は45秒程度なので、3分で見切る。
      - id: dep
        uses: actions/deploy-pages@v4
        continue-on-error: ${{ !inputs.fail_on_error }}
        with:
          timeout: 180000

      # continue-on-error で握りつぶした場合でも outcome には残るので、
      # 失敗したこと自体はログの注釈として必ず見えるようにする。
      - name: 配信の失敗を注釈として残す
        if: steps.dep.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages への配信に失敗しました。台帳・判断の記録・日報には影響しません（画面の更新だけが止まります）"
