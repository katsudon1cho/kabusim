name: kabusim session

# GitHub Actions の cron は UTC 固定。JST = UTC+9 なので9時間引いてある。
# 米国市場は夏時間で1時間ずれるため、11月の切り替え時に us-open / us-close /
# report の3本を下の「冬時間」の値に差し替えること。忘れると開場前・引け後に走る。
#
#   セッション   JST         UTC(夏)      UTC(冬)
#   jp-open      平日 09:08  8 0 * * 1-5    同左
#   jp-close     平日 14:38  38 5 * * 1-5   同左
#   us-open      平日 22:52  52 13 * * 1-5  52 14 * * 1-5  (JST 23:52)
#   us-close     火土 04:08  8 19 * * 1-5   8 20 * * 1-5   (JST 05:08)
#   report       火土 05:53  53 20 * * 1-5  53 21 * * 1-5  (JST 06:53)
#
# 分を 0/15/30/45 から外してあるのは意図的。GitHub のスケジュールは
# ベストエフォートで、混雑する丁度の時刻ほど遅延・間引きが大きい。
# 実測では最大3時間半ずれた（jp-open が 09:15 予定に対し 12:45 起動）。
#
# 実運用は外部の定時実行から tick を投げる方式（下の repository_dispatch）。
# 上の schedule は外部が止まったときの保険として残してある。
#
#   tick は毎日 :45 に飛んでくる（4,5,6,9,14,22,23時）。
#   どのセッションかは JST の「時」で決める:
#     04時 → us-close   06時 → report   09時 → jp-open
#     14時 → jp-close   22時 → us-open
#   曜日の判定もここで行う（日本市場ぶんは月〜金、米国の引け由来は火〜土）。
#   外部側にジョブを5本作るとトークンを5回入力することになり、
#   夏時間の切り替えも5箇所に散る。1本に集約してコード側で捌く。
#
#   5時と23時の tick は現状どれにも当たらず何もせず終わる。これは冬時間ぶんの
#   席で、11月に米国が冬時間へ移ったら下のマッピングを 05→us-close /
#   23→us-open に書き換えるだけで済む（外部サービス側は触らない）。
#   詳しくは SCHEDULE.md。

on:
  schedule:
    - cron: "8 0 * * 1-5"      # jp-open   JST 09:08 平日
    - cron: "38 5 * * 1-5"     # jp-close  JST 14:38 平日
    - cron: "52 13 * * 1-5"    # us-open   JST 22:52 平日
    - cron: "8 19 * * 1-5"     # us-close  JST 04:08 火〜土
    - cron: "53 20 * * 1-5"    # report    JST 05:53 火〜土

  # 外部の定時実行サービスから叩くための入口。スケジュールの遅延を避けたい
  # ときに使う。payload に {"session":"jp-open"} を渡す。
  repository_dispatch:
    types: [session, tick]

  workflow_dispatch:
    inputs:
      session:
        description: "手動で実行するセッション"
        required: true
        type: choice
        options: [jp-open, jp-close, us-open, us-close, report]

# contents:write は台帳のコミット用。これだけでよい。
# 以前は配信用に pages/id-token も宣言していたが、deploy ジョブを外したので不要。
permissions:
  contents: write

# state.json を複数のジョブが同時に書き換えると台帳が壊れる。直列化する。
concurrency:
  group: kabusim-ledger
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: セッション種別を決める
        id: sess
        run: |
          # tick は外部の定時実行から1日5回だけ飛んでくる合図。
          # どのセッションかは時刻から決める。外部側にジョブを5本作ると
          # トークンを5回入力することになり、曜日や夏時間の直しも5箇所に散る。
          if [ "${{ github.event.action }}" = "tick" ]; then
            H=$(TZ=Asia/Tokyo date +%H)
            D=$(TZ=Asia/Tokyo date +%u)     # 1=月 … 7=日
            case "$H" in
              04) S=us-close ;;
              06) S=report   ;;
              09) S=jp-open  ;;
              14) S=jp-close ;;
              22) S=us-open  ;;
              *)  S=""       ;;
            esac
            # 日本市場ぶんは月〜金。米国の引け由来（日本時間の早朝）は火〜土
            case "$S" in
              jp-open|jp-close|us-open)
                if [ "$D" -ge 6 ]; then S=""; fi ;;
              us-close|report)
                if [ "$D" -eq 1 ] || [ "$D" -eq 7 ]; then S=""; fi ;;
            esac
            [ -z "$S" ] && echo "この時刻・曜日に該当するセッションはありません（$H時 / 曜日$D）"
          else
            case "${{ github.event.schedule }}" in
              "8 0 * * 1-5")   S=jp-open  ;;
              "38 5 * * 1-5")  S=jp-close ;;
              "52 13 * * 1-5") S=us-open  ;;
              "8 19 * * 1-5")  S=us-close ;;
              "53 20 * * 1-5") S=report   ;;
              *) S="${{ github.event.client_payload.session || inputs.session }}" ;;
            esac
            if [ -z "$S" ]; then echo "セッション種別を決められない" >&2; exit 1; fi
          fi
          echo "session=$S" >> "$GITHUB_OUTPUT"
          echo "セッション: ${S:-（なし）}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet yfinance
          npm install -g @anthropic-ai/claude-code

      - name: 台帳の存在確認
        if: steps.sess.outputs.session != ''
        run: |
          if [ ! -f state.json ]; then
            echo "state.json が無い。先に broker.py init を実行してコミットすること。" >&2
            exit 1
          fi

      - name: セッション実行
        if: steps.sess.outputs.session != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PYTHON: python
        run: bash session.sh "${{ steps.sess.outputs.session }}"

      # セッションが途中で落ちても、それまでに成立した約定は state.json に
      # 書かれている。コミットしないと次回チェックアウトで台帳が巻き戻り、
      # クールダウンや約定数が現実とズレるので always() で必ず残す。
      # 画面用データ（docs/data/）はデプロイ時に作り直すのでコミットしない。
      - name: 記録をコミット
        if: always() && steps.sess.outputs.session != ''
        run: |
          git config user.name "kabusim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MARK=""
          if [ "${{ job.status }}" != "success" ]; then MARK=" [セッション失敗]"; fi
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし。コミットしない。"
          else
            git commit -m "${{ steps.sess.outputs.session }}: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST${MARK}"
            git push
          fi

      - name: 失敗時にログを残す
        if: failure()
        run: |
          echo "--- 直近のログ ---"
          tail -n 60 "logs/${{ steps.sess.outputs.session }}.log" 2>/dev/null || echo "ログなし"

  # 配信ジョブは置かない。
  #
  # 以前はここで deploy-pages.yml を呼び、セッションの記録を即座に画面へ
  # 反映していた。しかし配信が詰まると deploy ジョブが順番待ちのまま
  # 20分以上居座り、セッションの実行が終わらなくなる。そこへ次のセッションが
  # 来ると、待機中の実行が cancel される。8/7 の jp-open はこれで消えた。
  #
  # セッションは記録をコミットして終わる。画面への反映は20分おきに走る
  # prices が git から拾ってやる。サイトの遅れは最大20分だが、
  # サイトの都合で判断が失われるより桁違いにましである。
