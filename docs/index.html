<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仮想運用記録</title>
<meta name="description" content="仮想資金で運用するエージェントの判断記録">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070B14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="運用記録">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="aurora" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="pulse" id="pulse" aria-hidden="true"></span>
    <div class="brand-txt">
      <h1>仮想運用記録</h1>
      <p id="updated">読み込み中</p>
    </div>
  </div>
  <div class="chip-live" id="freshness">—</div>
</header>

<nav class="seg" role="tablist" aria-label="表示の切り替え">
  <span class="seg-glider" id="glider" aria-hidden="true"></span>
  <button role="tab" aria-selected="true"  aria-controls="view-overview" id="tab-overview">概要</button>
  <button role="tab" aria-selected="false" aria-controls="view-reports"  id="tab-reports">日報</button>
  <button role="tab" aria-selected="false" aria-controls="view-log"      id="tab-log">履歴</button>
</nav>

<main>

  <section id="view-overview" role="tabpanel" aria-labelledby="tab-overview">
    <div id="books" class="stack"></div>
  </section>

  <section id="view-reports" role="tabpanel" aria-labelledby="tab-reports" hidden>
    <div class="daterail" id="daterail"></div>
    <article id="report-body" class="card prose"></article>
  </section>

  <section id="view-log" role="tabpanel" aria-labelledby="tab-log" hidden>
    <div class="chips" id="log-filters">
      <button data-filter="all" class="on">すべて</button>
      <button data-filter="FILLED">約定</button>
      <button data-filter="REJECTED">却下</button>
    </div>
    <p class="hint">却下された注文も残している。何をやろうとして止められたかが、この記録の一番の材料になる。</p>
    <ol class="feed" id="ledger"></ol>
  </section>

</main>

<footer>
  <p>実際の金銭は動いていない。判断はモデル、制約はコードが強制している。</p>
  <p class="mono" id="stamp"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
