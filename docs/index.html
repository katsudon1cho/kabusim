<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運用記録</title>
<meta name="description" content="運用の判断記録">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0E11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="運用記録">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="pulse" id="pulse" aria-hidden="true"></span>
    <span class="bname">運用記録</span>
  </div>
  <span class="stamp-live" id="updated">読み込み中です</span>
  <span class="chip-live" id="freshness">—</span>
</header>

<nav class="tabs" role="tablist" aria-label="表示の切り替え">
  <button role="tab" aria-selected="true"  aria-controls="view-overview" id="tab-overview">概要</button>
  <button role="tab" aria-selected="false" aria-controls="view-holdings" id="tab-holdings">保有</button>
  <button role="tab" aria-selected="false" aria-controls="view-reports"  id="tab-reports">日報</button>
  <button role="tab" aria-selected="false" aria-controls="view-log"      id="tab-log">履歴</button>
</nav>

<main>

  <section id="view-overview" role="tabpanel" aria-labelledby="tab-overview">
    <div id="books"></div>
  </section>

  <section id="view-holdings" role="tabpanel" aria-labelledby="tab-holdings" hidden>
    <div id="holdings"></div>
  </section>

  <section id="view-reports" role="tabpanel" aria-labelledby="tab-reports" hidden>
    <div class="daterail" id="daterail"></div>
    <article id="report-body" class="prose"></article>
  </section>

  <section id="view-log" role="tabpanel" aria-labelledby="tab-log" hidden>
    <div class="ivs" id="log-filters">
      <span data-filter="all" class="on">すべて</span>
      <span data-filter="FILLED">約定</span>
      <span data-filter="REJECTED">却下</span>
    </div>
    <p class="hint">却下された注文も残しています。何をやろうとして止められたかが、この記録の一番の材料になります。</p>
    <ol class="feed" id="ledger"></ol>
  </section>

  <section id="view-detail" hidden>
    <button class="back" id="back">← 保有一覧</button>
    <div id="detail"></div>
  </section>

</main>

<footer>
  <p>判断はモデルが行い、制約はコードが強制しています。</p>
  <p class="mono" id="stamp"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
