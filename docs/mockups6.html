<script>
const MINE  = [46,44,48,40,43,36,38,30,33,26,28,20,24,16,18,12,14,8,10,5];
const P = a => a.map((y,i) => (i?"L":"M") + i*14 + " " + y).join(" ");

/* ローソク足。決まった種から作るので毎回同じ形になる */
function candles(n, w, h, upC, dnC, volH) {
  let s = 17; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const bw = w / n, bars = [];
  let p = h * 0.72;
  for (let i = 0; i < n; i++) {
    const o = p, c = Math.max(h * 0.12, Math.min(h * 0.86, p + (r() - 0.54) * h * 0.11));
    const hi = Math.min(o, c) - r() * h * 0.04, lo = Math.max(o, c) + r() * h * 0.04;
    bars.push({ o, c, hi, lo, x: i * bw + bw / 2, up: c < o, v: 0.25 + r() * 0.75 });
    p = c;
  }
  const body = bars.map(b => {
    const col = b.up ? upC : dnC;
    const top = Math.min(b.o, b.c), ht = Math.max(1.2, Math.abs(b.c - b.o));
    return `<line x1="${b.x.toFixed(1)}" y1="${b.hi.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.lo.toFixed(1)}" stroke="${col}" stroke-width=".8"/>
      <rect x="${(b.x - bw * .3).toFixed(1)}" y="${top.toFixed(1)}" width="${(bw * .6).toFixed(1)}" height="${ht.toFixed(1)}" fill="${col}"/>`;
  }).join("");
  const vol = volH ? bars.map(b =>
    `<rect x="${(b.x - bw * .3).toFixed(1)}" y="${(h + volH - b.v * volH).toFixed(1)}"
       width="${(bw * .6).toFixed(1)}" height="${(b.v * volH).toFixed(1)}"
       fill="${b.up ? upC : dnC}" opacity=".45"/>`).join("") : "";
  return `<svg viewBox="0 0 ${w} ${h + (volH || 0)}" style="width:100%;height:auto">${body}${vol}</svg>`;
}
