<style>

/* ============ 案28 Vercel / Geist 参照 ============ */

<body>
<div class="wrap">

<div class="intro">
  <h1>デザイン案 24〜29</h1>
  <p>実在するウェブアプリの設計言語を参照した6案。
     <a href="mockups.html">1〜7</a> ／ <a href="mockups2.html">8〜12</a> ／
     <a href="mockups3.html">13〜18</a> ／ <a href="mockups4.html">19〜23</a></p>
</div>

<div class="note">
  <b>やり方について。</b> 各アプリの実際の配色・字送り・余白・部品の作法を調べたうえで、
  それを<b>この運用記録の中身に当てはめ直しています</b>。ロゴや素材は使っていません。
  「Linear の作法で運用記録を作ったらどうなるか」という翻案です。
</div>

<div class="gal" id="gal"></div>

</div>

<script>
const MINE  = [46,44,48,40,43,36,38,30,33,26,28,20,24,16,18,12,14,8,10,5];
const BENCH = [48,47,49,45,46,43,44,41,42,38,39,36,37,34,35,32,33,30,31,28];
const P = a => a.map((y,i) => (i?"L":"M") + i*14 + " " + y).join(" ");
const CHART = (h=90) => `<svg viewBox="0 0 266 56" preserveAspectRatio="none" style="width:100%;height:${h}px">
  <path class="b" d="${P(BENCH)}"/><path class="a" d="${P(MINE)}"/></svg>`;
const MINI = (dn) => `<svg class="mini ${dn?"dn":""}" viewBox="0 0 266 56" preserveAspectRatio="none">
  <path d="${P(dn?MINE.slice().reverse():MINE)}"/></svg>`;

function ghGrid(){
  let o="",s=11;const r=()=>(s=(s*9301+49297)%233280)/233280;
  for(let i=0;i<130;i++){
    if(i>22){o+="<i></i>";continue}
    const v=r();
    const c=v<.3?"#151b23":v<.5?"#033a16":v<.7?"#196c2e":v<.88?"#2ea043":"#56d364";
    o+=`<i style="background:${c}"></i>`;
  }
  return o;
}

const DESIGNS = [

["Linear の作法で",
 "ほぼ黒の地に、4段階だけの面の明るさと0.5pxの罫線で構造を作る。文字は細め、字送りは詰め、色は紫のアクセント1色だけ。売買記録をイシュー一覧のように扱う。",
 "参照: Linear（#010102 地 / #5e6ad2 のアクセント / Inter系・字送り -0.022em / 6・12pxの角丸 / ホバーで面が持ち上がる）",
`<div class="tb"><span class="dot"></span><span class="t">仮想運用記録</span><span class="c">US · 22日目</span></div>
 <div class="panel">
   <div class="k">SPY との差</div>
   <div class="n vio">+0.56pt</div>
   <div class="sub">自分 <span class="grn">+2.48%</span> ／ ベンチ +1.92%</div>
 </div>
 <div class="panel" style="display:flex;gap:1.4rem">
   <div><div class="k">総資産</div><div class="n" style="font-size:1.05rem">$51,240</div></div>
   <div><div class="k">現金</div><div class="n" style="font-size:1.05rem">24.4%</div></div>
   <div><div class="k">買い枠</div><div class="n" style="font-size:1.05rem">1/4</div></div>
 </div>
 <div class="sect">判断ログ</div>
 <div class="row"><span class="id">L-14</span><span class="st"></span><span class="ti">買い LLY 3株 — 織り込み不足</span><span class="tag">US</span><span class="when">1h</span></div>
 <div class="row"><span class="id">L-13</span><span class="st x"></span><span class="ti">売買なし — 前提は崩れていない</span><span class="tag">JP</span><span class="when">11h</span></div>
 <div class="row"><span class="id">L-12</span><span class="st s"></span><span class="ti">却下 6861.T — 上限25%超過</span><span class="tag">JP</span><span class="when">16h</span></div>
 <div class="row"><span class="id">L-11</span><span class="st"></span><span class="ti">売り AMD 8株 — 利益率の前提が崩れた</span><span class="tag">US</span><span class="when">2d</span></div>
 <div class="row"><span class="id">L-10</span><span class="st x"></span><span class="ti">売買なし — 決算待ち</span><span class="tag">US</span><span class="when">2d</span></div>
 <div class="row"><span class="id">L-09</span><span class="st"></span><span class="ti">買い V 9株 — 決済高の伸びが継続</span><span class="tag">US</span><span class="when">3d</span></div>`],

["Robinhood の作法で",
 "純黒に緑一色。枠線も箱もほとんど無く、画面いっぱいのチャートと巨大な数字だけで構成する。期間切替が唯一の操作要素。",
 "参照: Robinhood（純黒地 / Robinhood Green #00C805 / 箱と罫線を極力使わない / 全幅チャート / 3〜4色しか使わない）",
`<div class="top">
   <div class="n">$51,240</div>
   <div class="d">+$1,240 (+2.48%) <span class="g">· SPY +1.92%</span></div>
 </div>
 <div class="chart">${CHART(120)}</div>
 <div class="ranges"><b>1D</b><span>1W</span><span>1M</span><span>3M</span><span>1Y</span><span>ALL</span></div>
 <div class="hr"></div>
 <div class="sec">保有</div>
 <div class="li"><div class="l"><div class="t">LLY</div><div class="s">3株</div></div>
   ${MINI(0)}<div class="r"><div class="v">$3,494</div><div class="p">+0.3%</div></div></div>
 <div class="li"><div class="l"><div class="t">NVDA</div><div class="s">12株</div></div>
   ${MINI(1)}<div class="r"><div class="v">$2,180</div><div class="p dn">−1.2%</div></div></div>
 <div class="li"><div class="l"><div class="t">V</div><div class="s">9株</div></div>
   ${MINI(0)}<div class="r"><div class="v">$2,910</div><div class="p">+1.8%</div></div></div>
 <div class="hr"></div>
 <div class="sec">直近の判断</div>
 <div class="li"><div class="l"><div class="t" style="font-size:.82rem;font-weight:400;line-height:1.5">
   上方修正の規模に対し株価反応が控えめ。<br>織り込み不足と判断した。</div>
   <div class="s" style="margin-top:.3rem">08-06 01:13 · 買い LLY</div></div></div>`],
