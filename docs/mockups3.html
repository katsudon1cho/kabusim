/* ---------- 案15 ヒートマップのマス目 ---------- */
function heat() {
  let out = "", seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 130; i++) {
    if (i > 22) { out += `<i></i>`; continue; }          // 未来は空
    const v = rnd() * 2 - 0.85;
    const c = v > 0
      ? `rgba(79,211,154,${(0.18 + Math.min(v, 1) * 0.72).toFixed(2)})`
      : `rgba(224,120,140,${(0.18 + Math.min(-v, 1) * 0.6).toFixed(2)})`;
    out += `<i style="background:${c}"></i>`;
  }
  return out;
}

/* ---------- 案14 勝敗マス ---------- */
function record() {
  let out = "", seed = 3;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 30; i++) {
    if (i >= 22) { out += `<i></i>`; continue; }
    out += `<i class="${rnd() > 0.42 ? "w" : "l"}"></i>`;
  }
  return out;
}
